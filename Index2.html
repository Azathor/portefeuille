<script type="text/babel" data-presets="react" data-plugins="">
const {useState,useEffect,useRef,useCallback,useMemo}=React;

/* ── Storage keys ── */
const K={TXNS:"amundi_txns_v2",PRIX:"amundi_prix_v2",THEME:"amundi_theme_v2",
         NAV:"amundi_nav_v2",ALERTS:"amundi_alerts_v2",ACCENT:"amundi_accent_v2",
         DEBLOCAGE:"amundi_deblocage_v2"};

/* ── Utils ── */
const fmt=(n,d=2)=>new Intl.NumberFormat("fr-FR",{minimumFractionDigits:d,maximumFractionDigits:d}).format(n);
const fmtE=(n,d=2)=>fmt(n,d)+" €";
const sgn=(n)=>n>=0?"+":"";
const toN=(s)=>parseFloat(String(s||"").replace(",","."));
function excelDateToISO(s){const d=new Date(Math.round((s-25569)*86400*1000));return d.toISOString().split("T")[0];}
function lsGet(k,fb=null){try{const v=localStorage.getItem(k);return v?JSON.parse(v):fb;}catch{return fb;}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch{}}

/* ── Accent palettes ── */
const ACCENTS={
  bleu:  {h:"#1565C0",h2:"#0D47A1",btn:"#1565C0",btn2:"#1976D2",sub:"#90CAF9",sub2:"#64B5F6",c1:"#1565C0",c1d:"#58A6FF"},
  vert:  {h:"#1B5E20",h2:"#145214",btn:"#2E7D32",btn2:"#388E3C",sub:"#A5D6A7",sub2:"#81C784",c1:"#2E7D32",c1d:"#3FB950"},
  violet:{h:"#4A148C",h2:"#38006B",btn:"#6A1B9A",btn2:"#7B1FA2",sub:"#CE93D8",sub2:"#BA68C8",c1:"#6A1B9A",c1d:"#BC8CFF"},
  orange:{h:"#E65100",h2:"#BF360C",btn:"#F57C00",btn2:"#EF6C00",sub:"#FFCC80",sub2:"#FFB74D",c1:"#E65100",c1d:"#FFA726"},
  rouge: {h:"#B71C1C",h2:"#7F0000",btn:"#C62828",btn2:"#D32F2F",sub:"#EF9A9A",sub2:"#E57373",c1:"#B71C1C",c1d:"#F85149"},

/* ── Themes ── */
function mkTheme(dark,acc){
  const a=ACCENTS[acc]||ACCENTS.bleu;
  return dark?{
    bg:"#0D1117",card:"#161B22",cardBdr:"#2A3140",
    header:a.h2,headerSub:a.sub2,kpiBg:"rgba(255,255,255,0.08)",
    text:"#E6EDF3",textSec:"#8B949E",textTer:"#484F58",
    inputBg:"#0D1117",inputBdr:"#30363D",formBg:"#0D1117",
    btnBg:a.btn2,btnTxt:"#FFFFFF",
    periodAct:a.btn2,periodTxt:"#8B949E",periodBdr:"#30363D",
    badgeBg:"#0C2D48",badgeTxt:"#64B5F6",
    green:"#3FB950",red:"#F85149",divider:"#2A3140",lockTxt:"#484F58",

    navBg:"#161B22",navBdr:"#2A3140",

    inputBg:"#FFFFFF",inputBdr:"#C5CCE0",formBg:"#EEF1FA",
    btnBg:a.btn,btnTxt:"#FFFFFF",
    periodAct:a.btn,periodTxt:"#5A6A85",periodBdr:"#C5CCE0",
    badgeBg:"#E3F2FD",badgeTxt:"#0C447C",
    green:"#1B5E20",red:"#B71C1C",divider:"#E0E4EE",lockTxt:"#9BA8BE",
    chartGrid:"#E8ECF5",chartTick:"#8896B0",
    navBg:"#FFFFFF",navBdr:"#E0E4EE",
    c1:a.c1,c2:"#2E7D32",c3:"#7B1FA2",c4:"#E65100",

/* ════ SVG CHART — cours action ════ */
function ActionChart({vals,labels,T,positive}){
  const W=340,H=160,PL=46,PR=10,PT=10,PB=28;
  const iW=W-PL-PR,iH=H-PT-PB;
  const [tip,setTip]=useState(null);
  const svgRef=useRef(null);
  if(!vals||!vals.length)return null;
  const mn=Math.min(...vals)-Math.max((Math.max(...vals)-Math.min(...vals))*0.12,1);
  const mx=Math.max(...vals)+Math.max((Math.max(...vals)-Math.min(...vals))*0.12,1);
  const xOf=i=>PL+(i/(vals.length-1||1))*iW;
  const yOf=v=>PT+iH-((v-mn)/(mx-mn||1))*iH;
  const path=vals.map((v,i)=>`${i===0?"M":"L"}${xOf(i).toFixed(1)},${yOf(v).toFixed(1)}`).join(" ");
  const area=path+` L${xOf(vals.length-1).toFixed(1)},${PT+iH} L${xOf(0).toFixed(1)},${PT+iH} Z`;
  const color=positive?T.c2:T.red;
  const ticks=Array.from({length:5},(_,i)=>mn+(mx-mn)*i/4);
  const xIdx=vals.length<=6?vals.map((_,i)=>i):[0,Math.round((vals.length-1)/4),Math.round((vals.length-1)/2),Math.round(3*(vals.length-1)/4),vals.length-1];
  function upd(cx){
    if(!svgRef.current)return;
    const r=svgRef.current.getBoundingClientRect();
    const x=(cx-r.left)*(W/r.width)-PL;
    const idx=Math.max(0,Math.min(vals.length-1,Math.round(x/iW*(vals.length-1))));
    setTip({idx,x:xOf(idx),v:vals[idx]});
  }
  return(
    <svg ref={svgRef} viewBox={`0 0 ${W} ${H}`} style={{width:"100%",height:"auto",display:"block",cursor:"crosshair",touchAction:"none"}}
      onMouseMove={e=>upd(e.clientX)} onMouseLeave={()=>setTip(null)}
      onTouchMove={e=>{e.preventDefault();upd(e.touches[0].clientX);}} onTouchEnd={()=>setTip(null)}>
      <defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor={color} stopOpacity="0.3"/><stop offset="100%" stopColor={color} stopOpacity="0.02"/></linearGradient></defs>
      {ticks.map((v,i)=><line key={i} x1={PL} y1={yOf(v)} x2={W-PR} y2={yOf(v)} stroke={T.chartGrid} strokeWidth="0.8"/>)}
      {ticks.map((v,i)=><text key={i} x={PL-5} y={yOf(v)+4} textAnchor="end" fontSize="7.5" fill={T.chartTick}>{fmt(v,2)}</text>)}
      {xIdx.map(i=><text key={i} x={xOf(i)} y={H-4} textAnchor="middle" fontSize="7.5" fill={T.chartTick}>{labels[i]}</text>)}
      <path d={area} fill="url(#ag)"/>
      <path d={path} fill="none" stroke={color} strokeWidth="2.2" strokeLinejoin="round" strokeLinecap="round"/>
      <circle cx={xOf(vals.length-1)} cy={yOf(vals[vals.length-1])} r="4" fill={color} stroke={T.card} strokeWidth="2"/>
      {tip&&<><line x1={tip.x} y1={PT} x2={tip.x} y2={PT+iH} stroke={T.chartTick} strokeWidth="1" strokeDasharray="3,2"/>
        <circle cx={tip.x} cy={yOf(tip.v)} r="4" fill={color} stroke={T.card} strokeWidth="2"/>
        {(()=>{const bw=90,bh=30;const bx=tip.x+8+bw>W-PR?tip.x-bw-8:tip.x+8;const by=Math.max(PT,Math.min(PT+iH-bh,yOf(tip.v)-bh/2));return(
          <g><rect x={bx} y={by} width={bw} height={bh} rx="5" fill={T.card} stroke={T.cardBdr} strokeWidth="1" opacity="0.97"/>
          <text x={bx+7} y={by+11} fontSize="7.5" fill={T.textSec}>{labels[tip.idx]}</text>
          <text x={bx+7} y={by+23} fontSize="8.5" fill={color} fontWeight="700">{fmtE(tip.v,4)}</text></g>);})()}</>}
    </svg>
  );
}

/* ════ SVG CHART — portefeuille ════ */
function LineChart({series,labels,colors,T}){
  const W=340,H=160,PL=46,PR=46,PT=10,PB=28;
  const iW=W-PL-PR,iH=H-PT-PB;
  const [tip,setTip]=useState(null);
  const svgRef=useRef(null);
  if(!labels||!labels.length)return(<div style={{height:H,display:"flex",alignItems:"center",justifyContent:"center",color:T.textTer,fontSize:13}}>Ajoutez une transaction pour voir le graphique</div>);
  const lD=series.filter(s=>s.axis==="L").flatMap(s=>s.data);
  const rD=series.filter(s=>s.axis==="R").flatMap(s=>s.data);
  const pL=(Math.max(...lD)-Math.min(...lD))*0.08||50,pR=(Math.max(...rD)-Math.min(...rD))*0.08||2;
  const xOf=i=>PL+(i/(labels.length-1||1))*iW;
  const yOf=(v,ax)=>{const[mn,mx]=ax==="L"?[Math.min(...lD)-pL,Math.max(...lD)+pL]:[Math.min(...rD)-pR,Math.max(...rD)+pR];return PT+iH-((v-mn)/(mx-mn||1))*iH;};
  const pathOf=(d,ax)=>d.map((v,i)=>`${i===0?"M":"L"}${xOf(i).toFixed(1)},${yOf(v,ax).toFixed(1)}`).join(" ");
  const areaOf=(d,ax)=>{const b=PT+iH;return pathOf(d,ax)+` L${xOf(d.length-1).toFixed(1)},${b} L${xOf(0).toFixed(1)},${b} Z`;};
  const mkT=(mn,mx,p,n=4)=>Array.from({length:n+1},(_,i)=>(mn-p)+(mx-mn+2*p)*i/n);
  const tL=mkT(Math.min(...lD),Math.max(...lD),pL);
  const tR=mkT(Math.min(...rD),Math.max(...rD),pR);
  const xIdx=labels.length<=6?labels.map((_,i)=>i):[0,Math.round((labels.length-1)/4),Math.round((labels.length-1)/2),Math.round(3*(labels.length-1)/4),labels.length-1];
  function upd(cx){if(!svgRef.current)return;const r=svgRef.current.getBoundingClientRect();const x=(cx-r.left)*(W/r.width)-PL;const idx=Math.max(0,Math.min(labels.length-1,Math.round(x/iW*(labels.length-1))));setTip({idx,x:xOf(idx),vals:series.map(s=>s.data[idx])});}
  return(
    <svg ref={svgRef} viewBox={`0 0 ${W} ${H}`} style={{width:"100%",height:"auto",display:"block",cursor:"crosshair",touchAction:"none"}}
      onMouseMove={e=>upd(e.clientX)} onMouseLeave={()=>setTip(null)}
      onTouchMove={e=>{e.preventDefault();upd(e.touches[0].clientX);}} onTouchEnd={()=>setTip(null)}>
      {tL.map((v,i)=><line key={i} x1={PL} y1={yOf(v,"L")} x2={W-PR} y2={yOf(v,"L")} stroke={T.chartGrid} strokeWidth="0.8"/>)}
      {tL.map((v,i)=><text key={i} x={PL-5} y={yOf(v,"L")+4} textAnchor="end" fontSize="7.5" fill={T.chartTick}>{fmt(v,0)}</text>)}
      {tR.map((v,i)=><text key={i} x={W-PR+5} y={yOf(v,"R")+4} textAnchor="start" fontSize="7.5" fill={colors[2]}>{fmt(v,2)}</text>)}
      {xIdx.map(i=><text key={i} x={xOf(i)} y={H-4} textAnchor="middle" fontSize="7.5" fill={T.chartTick}>{labels[i]}</text>)}
      <path d={areaOf(series[0].data,"L")} fill={colors[0]} opacity="0.10"/>
      {series.map((s,si)=><path key={si} d={pathOf(s.data,s.axis)} fill="none" stroke={colors[si]} strokeWidth={si===2?1.5:2.2} strokeDasharray={si===2?"5,3":undefined} strokeLinejoin="round" strokeLinecap="round"/>)}
      {tip&&<line x1={tip.x} y1={PT} x2={tip.x} y2={PT+iH} stroke={T.chartTick} strokeWidth="1" strokeDasharray="3,2"/>}
      {tip&&series.map((s,si)=><circle key={si} cx={tip.x} cy={yOf(s.data[tip.idx],s.axis)} r="4" fill={colors[si]} stroke={T.card} strokeWidth="2"/>)}
      {tip&&(()=>{const bw=118,bh=series.length*17+14;const bx=tip.x+10+bw>W-PR?tip.x-bw-10:tip.x+10;const by=Math.max(PT,Math.min(PT+iH-bh,yOf(tip.vals[0],"L")-bh/2));return(
        <g><rect x={bx} y={by} width={bw} height={bh} rx="6" fill={T.card} stroke={T.cardBdr} strokeWidth="1" opacity="0.97"/>
        <text x={bx+7} y={by+12} fontSize="8" fill={T.textSec} fontWeight="600">{labels[tip.idx]}</text>
        {series.map((s,si)=><g key={si}><rect x={bx+7} y={by+19+si*17} width="8" height="3" rx="1" fill={colors[si]}/><text x={bx+19} y={by+24+si*17} fontSize="7.5" fill={T.text}>{s.label}: {s.axis==="L"?fmtE(tip.vals[si]):fmt(tip.vals[si],4)+" €"}</text></g>)}</g>);})()}
    </svg>
  );
}

/* ════ DONUT CHART ════ */
function DonutChart({data,T}){
  const size=140,cx=70,cy=70,r=52,stroke=18;
  const total=data.reduce((s,d)=>s+d.v,0)||1;
  let angle=-Math.PI/2;
  const slices=data.map(d=>{
    const a=d.v/total*2*Math.PI;
    const x1=cx+r*Math.cos(angle),y1=cy+r*Math.sin(angle);
    angle+=a;
    const x2=cx+r*Math.cos(angle),y2=cy+r*Math.sin(angle);
    const lg=a>Math.PI?1:0;
    return{...d,d:`M ${x1.toFixed(2)} ${y1.toFixed(2)} A ${r} ${r} 0 ${lg} 1 ${x2.toFixed(2)} ${y2.toFixed(2)}`,a};
  });
  return(
    <svg viewBox={`0 0 ${size} ${size}`} style={{width:size,height:size,display:"block",margin:"0 auto"}}>
      {total===0?<circle cx={cx} cy={cy} r={r} fill="none" stroke={T.chartGrid} strokeWidth={stroke}/>:
        slices.map((s,i)=><path key={i} d={s.d} fill="none" stroke={s.color} strokeWidth={stroke} strokeLinecap="butt"/>)}
      <text x={cx} y={cy-6} textAnchor="middle" fontSize="10" fill={T.textSec}>Total</text>
      <text x={cx} y={cy+10} textAnchor="middle" fontSize="11" fontWeight="700" fill={T.text}>{fmtE(total)}</text>
    </svg>
  );
}

/* ════ ADD FORM ════ */
function AddForm({onSave,onCancel,T}){
  const rDate=useRef(),rMontant=useRef(),rAbond=useRef(),rPrix=useRef(),rParts=useRef();
  function save(){
    const date=rDate.current.value,m=toN(rMontant.current.value),ab=toN(rAbond.current.value),p=toN(rPrix.current.value),pr=toN(rParts.current.value);
    if(!date||isNaN(m)||isNaN(p)){alert("Date, montant personnel et prix requis.");return;}
    const abondement=isNaN(ab)?0:ab;
    onSave({date,montant:m,abondement,prix:p,parts:isNaN(pr)?+((m+abondement)/p).toFixed(5):pr});
  }
  const iS={width:"100%",fontSize:16,padding:"10px 11px",border:"1px solid "+T.inputBdr,borderRadius:9,background:T.inputBg,color:T.text,outline:"none"};
  const fields=[["Date","date","date",rDate,new Date().toISOString().split("T")[0],""],
    ["Ma part (€)","text","decimal",rMontant,"","ex: 300,00"],
    ["Abondement entreprise (€)","text","decimal",rAbond,"","optionnel"],
    ["Prix de la part (€)","text","decimal",rPrix,"","ex: 85,67"],
    ["Parts achetées (optionnel)","text","decimal",rParts,"","auto si vide"]];
  return(
    <div style={{background:T.formBg,border:"1px solid "+T.cardBdr,borderRadius:12,padding:14,marginBottom:14}}>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:10}}>
        {fields.map(([lbl,type,mode,ref,def,ph],i)=>(
          <div key={i} style={{gridColumn:i===0?"1/-1":undefined}}>
            <div style={{fontSize:11,color:T.textSec,marginBottom:5,fontWeight:500}}>{lbl}</div>
            <input ref={ref} type={type} inputMode={mode} placeholder={ph} defaultValue={type==="date"?def:""} style={iS}/>
          </div>
        ))}
      </div>
      <div style={{fontSize:11,color:T.textSec,padding:"8px 10px",background:T.card,borderRadius:8,border:"0.5px solid "+T.cardBdr,marginBottom:10}}>
        💡 Parts calculées sur ma part + abondement. L'abondement compte dans les gains.
      </div>
      <div style={{display:"flex",gap:8}}>
        <button onClick={onCancel} style={{flex:1,padding:"10px 0",background:"transparent",color:T.textSec,border:"1px solid "+T.cardBdr,borderRadius:10,fontSize:14,cursor:"pointer"}}>Annuler</button>
        <button onClick={save} style={{flex:2,padding:"10px 0",background:T.btnBg,color:T.btnTxt,border:"none",borderRadius:10,fontSize:14,fontWeight:600,cursor:"pointer"}}>✓ Enregistrer</button>
      </div>
    </div>
  );
}

/* ════ MAIN APP ════ */
function App(){
  const [txns,setTxns]=useState([]);
  const [prix,setPrix]=useState(85.67);
  const [prixInp,setPrixInp]=useState("85,6700");
  const prixRef=useRef(null);
  const [period,setPeriod]=useState("1M");
  const [chartView,setChartView]=useState("portefeuille");
  const [actionPeriod,setActionPeriod]=useState("1J");
  const [tab,setTab]=useState("dashboard"); // dashboard | transactions | settings
  const [showForm,setShowForm]=useState(false);
  const [saved,setSaved]=useState(false);
  const [loading,setLoading]=useState(true);
  const [dark,setDark]=useState(false);
  const [accent,setAccent]=useState("bleu");
  const [navHistory,setNavHistory]=useState([]);
  const [navImporting,setNavImporting]=useState(false);
  const [navMsg,setNavMsg]=useState("");
  const [alerts,setAlerts]=useState({high:"",low:""});
  const alertHighRef=useRef(null),alertLowRef=useRef(null);
  const [hidden,setHidden]=useState(false); // mode discret
  const [simRate,setSimRate]=useState(5);
  const [simMensuel,setSimMensuel]=useState(200);

  const T=useMemo(()=>mkTheme(dark,accent),[dark,accent]);

  /* ── Load ── */
  useEffect(()=>{
    const t=lsGet(K.TXNS),p=lsGet(K.PRIX),th=lsGet(K.THEME),nav=lsGet(K.NAV),al=lsGet(K.ALERTS),ac=lsGet(K.ACCENT);
    setTxns(t||[]);
    if(p!==null){setPrix(p);setPrixInp(String(p).replace(".",","));}
    if(th!==null)setDark(th);else setDark(window.matchMedia&&window.matchMedia("(prefers-color-scheme:dark)").matches);
    if(nav&&nav.length)setNavHistory(nav);
    if(al)setAlerts(al);
    if(ac)setAccent(ac);
    setLoading(false);
  },[]);

  function saveTxns(d){setTxns(d);lsSet(K.TXNS,d);}
  function toggleTheme(){const n=!dark;setDark(n);lsSet(K.THEME,n);}
  function changeAccent(a){setAccent(a);lsSet(K.ACCENT,a);}
  function saveAlerts(){
    const h=toN(alertHighRef.current?.value||""),l=toN(alertLowRef.current?.value||"");
    const al={high:isNaN(h)?"":h,low:isNaN(l)?"":l};
    setAlerts(al);lsSet(K.ALERTS,al);setSaved(true);setTimeout(()=>setSaved(false),2000);
  }
  function handleSavePrix(){
    const v=toN(prixRef.current?prixRef.current.value:prixInp);
    if(isNaN(v)||v<=0)return;
    setPrix(v);lsSet(K.PRIX,v);setSaved(true);setTimeout(()=>setSaved(false),2000);
  }
  function addTxn(data){saveTxns([...txns,{id:Date.now(),...data}].sort((a,b)=>a.date.localeCompare(b.date)));setShowForm(false);}
  function delTxn(id){if(confirm("Supprimer cette transaction ?"))saveTxns(txns.filter(t=>t.id!==id));}

  /* ── Export / Import ── */
  function exportData(){
    const blob=new Blob([JSON.stringify({transactions:txns,prixActuel:prix},null,2)],{type:"application/json"});
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);
    a.download="portefeuille_amundi_"+new Date().toISOString().split("T")[0]+".json";a.click();
  }
  function importData(e){
    const file=e.target.files[0];if(!file)return;
    const r=new FileReader();
    r.onload=ev=>{try{const d=JSON.parse(ev.target.result);if(d.transactions){saveTxns(d.transactions);alert("✓ "+d.transactions.length+" transactions importées !");}if(d.prixActuel){setPrix(d.prixActuel);lsSet(K.PRIX,d.prixActuel);}}catch{alert("Fichier JSON invalide.");}};
    r.readAsText(file);e.target.value="";
  }
  function importAmundiXLSX(e){
    const file=e.target.files[0];if(!file)return;
    setNavImporting(true);setNavMsg("");
    const reader=new FileReader();
    reader.onload=ev=>{
      try{
        const wb=XLSX.read(ev.target.result,{type:"array"});
        const ws=wb.Sheets[wb.SheetNames[0]];
        const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:null,raw:true});
        const navData=[];
        for(let i=0;i<rows.length;i++){
          const row=rows[i];if(!row)continue;
          const rawDate=row[1],rawNav=row[3];
          if(rawDate===null||rawDate===undefined||rawDate==="Date")continue;
          const nav=parseFloat(rawNav);if(isNaN(nav)||nav<=0)continue;
          let ds="";
          if(typeof rawDate==="number"&&rawDate>40000)ds=excelDateToISO(rawDate);
          else if(rawDate instanceof Date||String(rawDate).match(/\d{4}-\d{2}-\d{2}/))ds=new Date(rawDate).toISOString().split("T")[0];
          else if(typeof rawDate==="string"&&rawDate.includes("/")){const[dd,mm,yyyy]=rawDate.split("/");ds=`${yyyy}-${mm.padStart(2,"0")}-${dd.padStart(2,"0")}`;}
          if(ds&&ds.match(/^\d{4}-\d{2}-\d{2}$/))navData.push({date:ds,nav});
        }
        if(!navData.length)throw new Error("Aucune donnée NAV trouvée. Vérifiez que c'est le fichier Export NAV Amundi.");
        navData.sort((a,b)=>a.date.localeCompare(b.date));
        setNavHistory(navData);lsSet(K.NAV,navData);
        const last=navData[navData.length-1];
        if(last){setPrix(last.nav);lsSet(K.PRIX,last.nav);}
        setNavMsg("✓ "+navData.length+" valeurs importées ("+navData[0].date+" → "+last.date+")");
      }catch(err){setNavMsg("❌ "+err.message);}
      setNavImporting(false);
    };
    reader.readAsArrayBuffer(file);e.target.value="";
  }

  /* ── Calculs ── */
  const totalCash=txns.reduce((s,t)=>s+t.montant,0);
  const totalAbondement=txns.reduce((s,t)=>s+(t.abondement||0),0);
  const totalInvesti=totalCash+totalAbondement;
  const totalParts=txns.reduce((s,t)=>s+t.parts,0);
  const valeur=totalParts*prix;
  const gain=valeur-totalCash;
  const perf=totalCash>0?gain/totalCash*100:0;
  const prixMoyen=totalParts>0?totalInvesti/totalParts:0;
  const gainColor=gain>=0?T.green:T.red;
  const gainSansAbond=valeur-totalInvesti;

  /* ── Alertes ── */
  const alerteHaute=alerts.high&&prix>=parseFloat(alerts.high);

  /* ── Dates de déblocage (PEE : 5 ans) ── */
  const deblocages=useMemo(()=>txns.map(t=>{
    const d=new Date(t.date);d.setFullYear(d.getFullYear()+5);
    const now=new Date();const diff=d-now;
    const jours=Math.ceil(diff/(1000*60*60*24));
    return{...t,deblocage:d.toISOString().split("T")[0],jours,disponible:jours<=0};
  }),[txns]);

  /* ── Simulateur ── */
  const simulation=useMemo(()=>{
    const pts=[];let v=valeur;
    for(let i=1;i<=12;i++){v=v*(1+simRate/100/12)+simMensuel;pts.push({m:i,v:Math.round(v)});}
    const v1an=pts[pts.length-1]?.v||valeur;
    const v5ans=Array.from({length:60},(_,i)=>i+1).reduce((acc)=>acc*(1+simRate/100/12)+simMensuel,valeur);
    return{pts,v1an:Math.round(v1an),v5ans:Math.round(v5ans)};
  },[valeur,simRate,simMensuel]);

  /* ── Chart data ── */
  const chartData=useCallback(()=>{
    if(!txns.length)return null;
    const now=new Date();
    const days={"7J":7,"1M":30,"3M":90,"1A":365,"TOUT":3650}[period]||30;
    const sorted=[...txns].sort((a,b)=>a.date.localeCompare(b.date));
    const fromD=new Date(now);fromD.setDate(fromD.getDate()-days);
    const start=new Date(sorted[0].date)>fromD?new Date(sorted[0].date):fromD;
    const step=days<=30?1:days<=90?3:7;
    const pts=[];const d=new Date(start);
    while(d<=now){
      const ds=d.toISOString().split("T")[0];
      let cp=0,cc=0;
      for(const t of sorted){if(t.date<=ds){cp+=t.parts;cc+=t.montant+(t.abondement||0);}}
      const avgBuy=cp>0?cc/cp:prixMoyen||prix;
      const elapsed=(d-start)/((now-start)||1);
      const simPrix=+(avgBuy+(prix-avgBuy)*elapsed).toFixed(4);
      pts.push({ds,cash:+cc.toFixed(2),portef:+(cp*simPrix).toFixed(2),part:simPrix});
      d.setDate(d.getDate()+step);
    }
    if(pts.length){pts[pts.length-1].portef=+(totalParts*prix).toFixed(2);pts[pts.length-1].part=prix;}
    const lf=days<=90?{day:"2-digit",month:"2-digit"}:{month:"short",year:"2-digit"};
    return{labels:pts.map(p=>new Date(p.ds).toLocaleDateString("fr-FR",lf)),cash:pts.map(p=>p.cash),portef:pts.map(p=>p.portef),part:pts.map(p=>p.part)};
  },[txns,period,prix,prixMoyen,totalParts]);

  const actionData=useCallback(()=>{
    const now=new Date();
    const cutDays={"4H":1,"1J":1,"1S":7,"1M":30,"1A":365}[actionPeriod]||30;
    const lf=cutDays<=1?{day:"2-digit",month:"2-digit"}:cutDays<=7?{day:"2-digit",month:"2-digit"}:cutDays<=30?{day:"2-digit",month:"2-digit"}:{month:"short",year:"2-digit"};
    if(navHistory&&navHistory.length>0){
      const cutDate=new Date(now);cutDate.setDate(cutDate.getDate()-cutDays);
      let f=navHistory.filter(p=>new Date(p.date)>=cutDate);
      if(cutDays<=1)f=navHistory.slice(-2);
      if(!f.length)f=navHistory.slice(-Math.min(30,navHistory.length));
      const vals=f.map(p=>p.nav);
      const labels=f.map(p=>new Date(p.date).toLocaleDateString("fr-FR",lf));
      const diff=vals[vals.length-1]-vals[0],diffPct=vals[0]>0?diff/vals[0]*100:0;
      return{labels,vals,diff,diffPct,real:true};
    }
    const seed=prix*137.5+cutDays*7.3;
    const nPts=cutDays<=1?2:cutDays<=7?7:cutDays<=30?30:52;
    function sr(i){let x=Math.sin(seed+i)*10000;return x-Math.floor(x);}
    const rawPts=[];let v=prix;
    for(let i=nPts;i>=0;i--){
      const noise=cutDays<=1?0.05:cutDays<=7?0.30:cutDays<=30?0.70:3.0;
      v=Math.max(prix*0.7,Math.min(prix*1.3,v+(sr(i)*2-1)*noise));
      const d2=new Date(now);d2.setDate(d2.getDate()-i*(cutDays/nPts));
      rawPts.push({v:+v.toFixed(4),label:d2.toLocaleDateString("fr-FR",lf)});
    }
    rawPts[rawPts.length-1].v=prix;
    const diff=prix-rawPts[0].v;
    return{labels:rawPts.map(p=>p.label),vals:rawPts.map(p=>p.v),diff,diffPct:rawPts[0].v>0?diff/rawPts[0].v*100:0,real:false};

      {showForm&&<AddForm T={T} onCancel={()=>setShowForm(false)} onSave={addTxn}/>}
      <Card px={12}>
        {txns.length===0&&<div style={{textAlign:"center",color:T.textTer,fontSize:13,padding:20}}>Aucune transaction</div>}
        {(()=>{let cp=0,cc=0;return txns.map((t,i)=>{
          cp+=t.parts;cc+=t.montant;
          const g=cp*prix-cc,pf=cc>0?g/cc*100:0,gc=g>=0?T.green:T.red;
          const dl=new Date(t.date).toLocaleDateString("fr-FR",{day:"2-digit",month:"2-digit",year:"numeric"});
          return(
            <div key={t.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"11px 0",borderBottom:i<txns.length-1?"0.5px solid "+T.divider:"none"}}>
              <div>
                <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:3}}>
                  <span style={{fontSize:11,color:T.textSec}}>{dl}</span>
                  <span style={{background:T.badgeBg,color:T.badgeTxt,borderRadius:5,padding:"1px 7px",fontSize:10,fontWeight:700}}>Achat</span>
                </div>
                <div style={{fontSize:15,fontWeight:700,color:T.text}}>{mask(fmtE(t.montant))}{(t.abondement>0)&&<span style={{fontSize:11,color:"#7B1FA2",fontWeight:600,marginLeft:6}}>+{mask(fmtE(t.abondement))} 🎁</span>}</div>
                <div style={{fontSize:11,color:T.textSec}}>{fmt(t.parts,5)} parts · {fmtE(t.prix,4)}/part</div>
              </div>
              <div style={{textAlign:"right",display:"flex",flexDirection:"column",alignItems:"flex-end",gap:4}}>
                <div style={{fontSize:14,fontWeight:700,color:gc}}>{sgn(g)}{mask(fmtE(g))}</div>
                <div style={{fontSize:11,color:gc}}>{sgn(pf)}{fmt(pf,2)} %</div>
                <button onClick={()=>delTxn(t.id)} style={{background:"none",border:"none",cursor:"pointer",fontSize:17,lineHeight:1,color:T.textTer}}>🗑</button>
              </div>
            </div>
          );
        });})()}
      </Card>
    </div>
  );

  /* ════════ ONGLET PARAMÈTRES ════════ */
  const renderSettings=()=>(
    <div style={{paddingBottom:80}}>

      {/* Thème */}
      <Card>
        <SectionTitle>Apparence</SectionTitle>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
          <span style={{fontSize:13,color:T.textSec}}>Mode sombre</span>
          <button onClick={toggleTheme} style={{background:dark?T.btnBg:T.cardBdr,border:"none",borderRadius:20,width:50,height:28,cursor:"pointer",position:"relative",transition:"background .2s"}}>
            <span style={{position:"absolute",left:dark?24:4,top:4,width:20,height:20,borderRadius:"50%",background:"#fff",transition:"left .25s"}}/>
          </button>
        </div>
        <div style={{fontSize:12,color:T.textSec,marginBottom:8,fontWeight:600}}>Couleur de thème</div>
        <div style={{display:"flex",gap:10",flexWrap:"wrap",gap:8}}>
          {Object.entries(ACCENTS).map(([k,a])=>(
            <button key={k} onClick={()=>changeAccent(k)} style={{width:36,height:36,borderRadius:"50%",background:a.btn,border:accent===k?"3px solid "+T.text:"3px solid transparent",cursor:"pointer",flexShrink:0}}/>
          ))}
        </div>
      </Card>

      {/* Alertes */}
      <Card>
        <SectionTitle>Alertes de prix</SectionTitle>
        <div style={{fontSize:12,color:T.textSec,marginBottom:12}}>Recevez une alerte visuelle quand le prix dépasse ces seuils.</div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:10}}>
          {[["Seuil haut (€)",alertHighRef,alerts.high],["Seuil bas (€)",alertLowRef,alerts.low]].map(([lbl,ref,val])=>(
            <div key={lbl}>
              <div style={{fontSize:11,color:T.textSec,marginBottom:5}}>{lbl}</div>
              <input ref={ref} type="text" inputMode="decimal" defaultValue={val}
                style={{width:"100%",fontSize:16,padding:"9px 11px",border:"1px solid "+T.inputBdr,borderRadius:9,background:T.inputBg,color:T.text,outline:"none"}}/>
            </div>
          ))}
        </div>
        <button onClick={saveAlerts} style={{width:"100%",padding:"10px 0",background:T.btnBg,color:T.btnTxt,border:"none",borderRadius:10,fontSize:13,fontWeight:600,cursor:"pointer"}}>
          Enregistrer les alertes {saved?"✓":""}
        </button>
        {(alerteHaute||alerteBasse)&&<div style={{marginTop:8,padding:"8px",background:alerteHaute?"rgba(27,94,32,0.1)":"rgba(183,28,28,0.1)",borderRadius:8,fontSize:12,color:alerteHaute?T.green:T.red,textAlign:"center"}}>
          {alerteHaute?"🎯 Seuil haut atteint !":"⚠️ Seuil bas atteint !"}
        </div>}
      </Card>

      {/* Mode discret */}
      <Card>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <div>
            <div style={{fontSize:13,fontWeight:600,color:T.text}}>Mode discret</div>
            <div style={{fontSize:12,color:T.textSec}}>Masque tous les montants (🙈)</div>
          </div>
          <button onClick={()=>setHidden(!hidden)} style={{background:hidden?T.btnBg:T.cardBdr,border:"none",borderRadius:20,width:50,height:28,cursor:"pointer",position:"relative",transition:"background .2s"}}>
            <span style={{position:"absolute",left:hidden?24:4,top:4,width:20,height:20,borderRadius:"50%",background:"#fff",transition:"left .25s"}}/>
          </button>
        </div>
      </Card>

      {/* Sauvegarde */}
      <Card>
        <SectionTitle>Sauvegarde des données</SectionTitle>
        <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:8}}>
          <button onClick={exportData} style={{flex:1,padding:"10px 0",background:T.btnBg,color:T.btnTxt,border:"none",borderRadius:10,fontSize:13,fontWeight:600,cursor:"pointer",minWidth:120}}>⬇️ Exporter (JSON)</button>
          <label style={{flex:1,display:"flex",alignItems:"center",justifyContent:"center",padding:"10px 0",background:"transparent",color:T.btnBg,border:"1px solid "+T.btnBg,borderRadius:10,fontSize:13,fontWeight:600,cursor:"pointer",minWidth:120}}>
            ⬆️ Importer (JSON)<input type="file" accept=".json" onChange={importData} style={{display:"none"}}/>
          </label>
        </div>
        <div style={{fontSize:11,color:T.textTer,textAlign:"center"}}>Exportez régulièrement pour sauvegarder dans iCloud Drive</div>
        {navHistory.length>0&&<div style={{fontSize:11,color:T.green,marginTop:6,textAlign:"center"}}>📊 {navHistory.length} VL en mémoire ({navHistory[0]?.date} → {navHistory[navHistory.length-1]?.date})</div>}
      </Card>

      <div style={{textAlign:"center",fontSize:11,color:T.lockTxt,paddingBottom:10}}>🔒 Données stockées localement · Aucun serveur externe</div>
    </div>
  );

  /* ════════ TAB BAR ════════ */
  const tabs=[["dashboard","📊","Tableau"],["transactions","💳","Transactions"],["settings","⚙️","Réglages"]];

  return(
    <div style={{background:T.bg,minHeight:"100vh",fontFamily:"system-ui,-apple-system,sans-serif"}}>
      <div style={{maxWidth:430,margin:"0 auto",padding:"12px 12px 0"}}>
        {tab==="dashboard"&&renderDashboard()}
        {tab==="transactions"&&renderTransactions()}
        {tab==="settings"&&renderSettings()}
      </div>

      {/* Tab bar fixe */}
      <div style={{position:"fixed",bottom:0,left:0,right:0,background:T.navBg,borderTop:"0.5px solid "+T.navBdr,display:"flex",zIndex:100,paddingBottom:"env(safe-area-inset-bottom)"}}>
        {tabs.map(([id,icon,label])=>(
          <button key={id} onClick={()=>setTab(id)}
            style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",padding:"10px 0 8px",background:"none",border:"none",cursor:"pointer",gap:2}}>
            <span style={{fontSize:22,lineHeight:1}}>{icon}</span>
            <span style={{fontSize:10,fontWeight:tab===id?700:400,color:tab===id?T.btnBg:T.textTer}}>{label}</span>
          </button>
        ))}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
